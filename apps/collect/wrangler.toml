name = "traks-collect-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "d890dbfe-f384-4711-b921-32fd5c91e20c"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "traks-dev"

[vars]
ENVIRONMENT = "development"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-collect"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db"
database_id = "TODO_CREATE_WHEN_READY"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "traks"

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (set per environment):
# Dev:
#   wrangler secret put VISITOR_HASH_SECRET
# Production:
#   wrangler secret put VISITOR_HASH_SECRET --env production
