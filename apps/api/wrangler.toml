name = "traks-api-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "src/db/migrations"

[[routes]]
pattern = "api-dev.traks.dev"
custom_domain = true

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "*"
R2_BUCKET_NAME = "traks-events-dev"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"
migrations_dir = "src/db/migrations"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://traks.dev,https://www.traks.dev"
R2_BUCKET_NAME = "traks-events"

[[env.production.routes]]
pattern = "api.traks.dev"
custom_domain = true

# Secrets managed via Doppler (project: traks-api, configs: dev / prd).
# Dev:     `yarn dev` pulls Doppler dev config into .dev.vars.doppler.
# Prod:    `yarn release:prod` runs `doppler secrets --json -c prd | wrangler secret bulk --env production`.
# Required keys: CLERK_SECRET_KEY, R2_ACCOUNT_ID, R2_SQL_TOKEN.
