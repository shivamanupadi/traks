name = "traks-api-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "src/db/migrations"

# Cross-script binding to the collect worker's live-stats Durable Object
# (hot path for "today"/realtime queries). The collect worker owns the class.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"
script_name = "traks-collect-dev"

# Global (cross-colo) result cache for R2 SQL dashboard queries. Layered
# behind the per-colo Cache API: a scan any colo already paid for is reused
# worldwide for the TTL.
[[kv_namespaces]]
binding = "R2SQL_CACHE"
id = "fc5eb93cfb8f4cb18969af2ccd4f9ea5"

# Nightly per-site raw-data exports (gzipped NDJSON, DuckDB-readable)
[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "traks-exports-dev"

# Transactional email (Cloudflare Email Service, open beta - Workers Paid).
# The EMAIL_FROM domain must be onboarded for Email Sending in the dashboard.
[[send_email]]
name = "EMAIL"

[triggers]
crons = [
  "30 3 * * *",   # nightly raw-data exports
  "0 8 * * 1",    # Monday weekly email digest
  "*/30 * * * *", # pipeline freshness healthcheck
]

[[routes]]
pattern = "api-dev.traks.dev"
custom_domain = true

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "*"
R2_BUCKET_NAME = "traks-events-dev"
APP_URL = "http://localhost:5012"
EMAIL_FROM = "reports@traks.dev"
ADMIN_EMAIL = "" # set to receive ops alerts
# Dodo billing is off until the account is out of review. To enable: set to
# "true", fill DODO_PRODUCT_* below, and add the DODO_* secrets in Doppler.
BILLING_ENABLED = "false"
DODO_API_BASE = "https://test.dodopayments.com"
DODO_PRODUCT_PRO = ""      # pdt_... (test mode)
DODO_PRODUCT_BUSINESS = "" # pdt_... (test mode)

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"
migrations_dir = "src/db/migrations"

[[env.production.durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"
script_name = "traks-collect"

[[env.production.kv_namespaces]]
binding = "R2SQL_CACHE"
id = "8d350a4f547a41218336ba9b4103fe0e"

[[env.production.r2_buckets]]
binding = "EXPORTS"
bucket_name = "traks-exports"

[[env.production.send_email]]
name = "EMAIL"

[env.production.triggers]
crons = ["30 3 * * *", "0 8 * * 1", "*/30 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://traks.dev,https://www.traks.dev"
R2_BUCKET_NAME = "traks-events"
APP_URL = "https://traks.dev"
EMAIL_FROM = "reports@traks.dev"
ADMIN_EMAIL = "shiva.manupadi@gmail.com" # ops alerts (pipeline stuck, etc.)
# Dodo billing is off until the account is out of review. To enable: set to
# "true", fill DODO_PRODUCT_* below, and add the DODO_* secrets in Doppler (prd).
BILLING_ENABLED = "false"
DODO_API_BASE = "https://live.dodopayments.com"
DODO_PRODUCT_PRO = ""      # pdt_... (live mode)
DODO_PRODUCT_BUSINESS = "" # pdt_... (live mode)

[[env.production.routes]]
pattern = "api.traks.dev"
custom_domain = true

# Secrets managed via Doppler (project: traks-api, configs: dev / prd).
# Dev:     `yarn dev` pulls Doppler dev config into .dev.vars.doppler.
# Prod:    `yarn release:prod` runs `doppler secrets --json -c prd | wrangler secret bulk --env production`.
# Required keys: CLERK_SECRET_KEY, R2_ACCOUNT_ID, R2_SQL_TOKEN.
#
# R2_SQL_TOKEN must carry all three permission groups (per R2 SQL docs):
#   Workers R2 SQL Read + Workers R2 Data Catalog Write + Workers R2 Storage Write
# (or use an R2 "Admin Read & Write" account token).
#
# Also required: CLERK_WEBHOOK_SECRET (Clerk dashboard -> Webhooks, point at
# /api/webhooks/clerk).
#
# Only needed once BILLING_ENABLED = "true" (Dodo is currently in review, so
# billing is gated off and these can be omitted): DODO_API_KEY,
# DODO_WEBHOOK_SECRET (Dodo dashboard -> Developer -> Webhooks endpoint secret).
