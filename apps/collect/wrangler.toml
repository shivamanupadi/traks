name = "traks-collect-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "../api/src/db/migrations"

# Hot-path live stats: one SQLite-backed Durable Object per site, written at
# ingest, read by the api worker for "today"/realtime dashboards.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteLiveStore"]

[[durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"

# Pipelines *stream* binding — events are sent to the stream, the pipeline
# moves them into the Iceberg sink. (`stream` replaced the deprecated
# `pipeline` key in June 2026.)
[[pipelines]]
binding = "EVENTS"
stream = "f0ee6ab42aa7462094f374857e996b47" # traks_events_dev_stream (dev)

[[routes]]
pattern = "collect-dev.traks.dev"
custom_domain = true

[vars]
ENVIRONMENT = "development"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-collect"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"

[[env.production.durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"

[[env.production.pipelines]]
binding = "EVENTS"
stream = "5e05e573671949848561ed0d31397743" # traks_events_stream (prod)

[[env.production.routes]]
pattern = "collect.traks.dev"
custom_domain = true

[env.production.vars]
ENVIRONMENT = "production"

# Secrets managed via Doppler (project: traks-collect, configs: dev / prd).
# Dev:     `yarn dev` pulls Doppler dev config into .dev.vars.doppler.
# Prod:    `yarn release:prod` runs `doppler secrets --json -c prd | wrangler secret bulk --env production`.
# Required keys: VISITOR_HASH_SECRET.
