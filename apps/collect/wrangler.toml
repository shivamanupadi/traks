name = "traks-collect-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "../api/src/db/migrations"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "traks-dev"

[[routes]]
pattern = "collect-dev.traks.dev"
custom_domain = true

[vars]
ENVIRONMENT = "development"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-collect"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "traks-prod"

[[env.production.routes]]
pattern = "collect.traks.dev"
custom_domain = true

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (set per environment):
# Dev:
#   wrangler secret put VISITOR_HASH_SECRET
# Production:
#   wrangler secret put VISITOR_HASH_SECRET --env production
