name = "traks-api-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote) ---
# Local dev serves the SPA from vite (:5012, proxying /api to :5011).

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "src/db/migrations"

# Cross-script binding to the collect worker's live-stats Durable Object
# (hot path for "today"/realtime queries). The collect worker owns the class.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"
script_name = "traks-collect-dev"

# Global (cross-colo) result cache for R2 SQL dashboard queries. Layered
# behind the per-colo Cache API: a scan any colo already paid for is reused
# worldwide for the TTL.
[[kv_namespaces]]
binding = "R2SQL_CACHE"
id = "fc5eb93cfb8f4cb18969af2ccd4f9ea5"

# No cron triggers; explicit empty list so deploys delete any previously
# registered schedules (omitting [triggers] would leave them in place).
# Release artifacts consumed by the /deploy web installer.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "traks-releases"

[triggers]
crons = []

[[routes]]
pattern = "api-dev.traks.dev"
custom_domain = true

[vars]
ENVIRONMENT = "development"
R2_BUCKET_NAME = "traks-events-dev"
R2_ACCOUNT_ID = "4cf68c768770ccda55d287d6ecbdeb4f"
COLLECT_URL = "https://collect-dev.traks.dev"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"
migrations_dir = "src/db/migrations"

[[env.production.durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"
script_name = "traks-collect"

[[env.production.kv_namespaces]]
binding = "R2SQL_CACHE"
id = "8d350a4f547a41218336ba9b4103fe0e"

[[env.production.r2_buckets]]
binding = "RELEASES"
bucket_name = "traks-releases"

[env.production.triggers]
crons = []

[env.production.vars]
ENVIRONMENT = "production"
R2_BUCKET_NAME = "traks-events"
R2_ACCOUNT_ID = "4cf68c768770ccda55d287d6ecbdeb4f"
COLLECT_URL = "https://collect.traks.dev"

# Single-worker deploy: this worker serves the SPA (static assets) and the
# API on one hostname, so the Better Auth session cookie is first-party by
# construction — including on bare workers.dev for one-click deploys.
# run_worker_first keeps /api/* out of the SPA fallback. The web build must
# exist before deploying (release:prod builds it). Local dev is unaffected:
# vite (:5012, HMR) proxies /api to wrangler dev (:5011).
[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/deploy/callback"]

# Cutover note: traks.dev/www.traks.dev were bound to the old traks-web
# worker — delete that worker (npx wrangler delete --name traks-web) right
# before the first deploy of this config, or the domain claim will conflict.
[[env.production.routes]]
pattern = "traks.dev"
custom_domain = true

[[env.production.routes]]
pattern = "www.traks.dev"
custom_domain = true


# Secrets managed via Doppler (project: traks-api, configs: dev / prd).
# Dev:     `yarn dev` pulls Doppler dev config into .dev.vars.doppler.
# Prod:    `yarn release:prod` runs `doppler secrets --json -c prd | wrangler secret bulk --env production`.
# Required keys: BETTER_AUTH_SECRET, R2_SQL_TOKEN.
#
# R2_SQL_TOKEN must carry all three permission groups (per R2 SQL docs):
#   Workers R2 SQL Read + Workers R2 Data Catalog Write + Workers R2 Storage Write
# (or use an R2 "Admin Read & Write" account token).

