# traks.dev home worker - deploy-wizard backend ONLY. Physically separate
# from the platform api that ships to customer instances: different worker,
# different D1 (registry only), different secrets. The marketing site +
# wizard UI is the traks-site static-assets worker; this worker claims the
# dynamic paths on traks.dev via zone routes (which beat custom domains).
name = "traks-home-api-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (default: wrangler dev --remote, port 5014) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-home-db-dev"
database_id = "884e81ce-ad87-41b5-b6fa-74dff8bc6115"
migrations_dir = "src/db/migrations"

# Release artifacts consumed by the /deploy web installer (shared with prod:
# releases are immutable, hash-addressed uploads).
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "traks-releases"

# Abuse guards for the public, unauthenticated wizard API. Namespaces are
# per-limiter; both are keyed by client IP.
#   1002 - token-verification endpoints (accounts/zones/verify-catalog): these
#          relay caller-supplied credentials to Cloudflare, so without a cap
#          traks.dev would be a free credential-validation oracle.
#   1003 - session creation (POST /instance), which writes a registry row.
[[unsafe.bindings]]
name = "VERIFY_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "SESSION_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[vars]
ENVIRONMENT = "development"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-home-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-home-db"
database_id = "6dcb69eb-8854-4d4c-a95a-9a2bfc36225e"
migrations_dir = "src/db/migrations"

[[env.production.r2_buckets]]
binding = "RELEASES"
bucket_name = "traks-releases"

# Abuse guards for the public, unauthenticated wizard API. Namespaces are
# per-limiter; both are keyed by client IP.
#   1002 - token-verification endpoints (accounts/zones/verify-catalog): these
#          relay caller-supplied credentials to Cloudflare, so without a cap
#          traks.dev would be a free credential-validation oracle.
#   1003 - session creation (POST /instance), which writes a registry row.
[[env.production.unsafe.bindings]]
name = "VERIFY_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "SESSION_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Nightly sweep of abandoned ('new') wizard sessions.
[env.production.triggers]
crons = ["17 3 * * *"]

[env.production.vars]
ENVIRONMENT = "production"

# traks.dev is owned by the traks-site worker (marketing + wizard UI); this
# worker takes only the wizard's backend paths there.
[[env.production.routes]]
pattern = "traks.dev/api/*"
zone_name = "traks.dev"

# OAuth redirect URI registered on the "Traks Deploy" client.
[[env.production.routes]]
pattern = "traks.dev/deploy/callback*"
zone_name = "traks.dev"

# Secrets (Doppler project traks-home, config prd - synced via
# `yarn secrets:prod:sync`):
#   CF_OAUTH_CLIENT_ID, CF_OAUTH_CLIENT_SECRET
