name = "traks-api-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# --- Dev (local-first: wrangler dev, shared state in <root>/.wrangler-state) ---
# Local dev serves the SPA from vite (:5012, proxying /api to :5011). D1/KV
# are local simulations; ids below are inert locally. Only the events
# warehouse (R2 SQL over traks-events-dev) is a real cloud dependency.

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "src/db/migrations"

# Cross-script binding to the collect worker's live-stats Durable Object
# (hot path for "today"/realtime queries). The collect worker owns the class.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "SiteLiveStore"
script_name = "traks-collect-dev"

# Global (cross-colo) result cache for R2 SQL dashboard queries. Layered
# behind the per-colo Cache API: a scan any colo already paid for is reused
# worldwide for the TTL.
[[kv_namespaces]]
binding = "R2SQL_CACHE"
id = "fc5eb93cfb8f4cb18969af2ccd4f9ea5"

# No cron triggers; explicit empty list so deploys delete any previously
# registered schedules (omitting [triggers] would leave them in place).
[triggers]
crons = []

[vars]
ENVIRONMENT = "development"
R2_BUCKET_NAME = "traks-events-dev"
R2_ACCOUNT_ID = "4cf68c768770ccda55d287d6ecbdeb4f"
COLLECT_URL = "http://localhost:5010"

# The platform ships to customers as a release bundle; the ONLY install path
# is the traks.dev deploy wizard. There is no wrangler prod deploy — our own
# instance (and any staging one) is installed through the wizard like any
# other customer. Dev config above is for local iteration only.
