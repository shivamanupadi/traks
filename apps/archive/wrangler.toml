name = "traks-archive-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

# --- Dev (default: wrangler dev --remote) ---

[[d1_databases]]
binding = "DB"
database_name = "traks-db-dev"
database_id = "cd0ff4bb-5cc4-4002-a259-be02b3234e29"
migrations_dir = "../api/src/db/migrations"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "traks-archive-bucket-dev"

[[queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "traks-archive-queue-dev"

[[queues.consumers]]
queue = "traks-archive-queue-dev"
max_batch_size = 1
max_retries = 5
max_concurrency = 2
dead_letter_queue = "traks-archive-dlq-dev"

[vars]
ENVIRONMENT = "development"

# --- Production: wrangler deploy --env production ---

[env.production]
name = "traks-archive"

[env.production.triggers]
crons = ["0 3 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "traks-db-prod"
database_id = "7a19029a-d3a0-4ebf-b7f7-3a0237cf4c1e"

[[env.production.r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "traks-archive-bucket-prod"

[[env.production.queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "traks-archive-queue-prod"

[[env.production.queues.consumers]]
queue = "traks-archive-queue-prod"
max_batch_size = 1
max_retries = 5
max_concurrency = 2
dead_letter_queue = "traks-archive-dlq-prod"

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (set per environment):
# wrangler secret put CF_ACCOUNT_ID
# wrangler secret put CF_API_TOKEN
# wrangler secret put CF_ACCOUNT_ID --env production
# wrangler secret put CF_API_TOKEN --env production
